
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASMA - Birthday Surprise</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, serif;
}

#app {
    width: min(100vw, 600px, calc(100vh * 0.857));
    aspect-ratio: 6 / 7;
    position: relative;
    background: black;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#chooser {
    position: absolute;
    inset: 0;
    background: #160b27;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
    text-align: center;
    padding: 20px;
}

#chooser h2 {
    color: #ff69b4;
    font-size: 30px;
}

button {
    background: #ff1493;
    color: white;
    padding: 13px 23px;
    border: 0;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
}

#status {
    color: #e8baff;
    font-size: 14px;
}
</style>
</head>

<body>
<div id="app">
    <canvas id="canvas" width="600" height="700"></canvas>

    <div id="chooser">
        <h2>🎁 For BASMA 💜</h2>
        <p>A special surprise made with love ❤️</p>
        <div id="status">Loading memories...</div>
        <button id="start" disabled>START SURPRISE ❤️</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const chooser = document.getElementById("chooser");
const statusText = document.getElementById("status");
const startButton = document.getElementById("start");

let photos = [];

const photoNames = [
    "basma1.jpeg",
    "basma2.jpeg",
    "basma3.jpeg",
    "basma4.jpeg",
    "basma6.jpeg"
];

// Load all photos automatically and preserve their order.
const photosReady = Promise.all(
    photoNames.map(name => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(name);
        img.src = "picture/" + name;
    }))
).then(images => {
    photos = images;
    statusText.textContent = "All memories are ready ❤️";
    startButton.disabled = false;
}).catch(error => {
    statusText.textContent = "Could not load: " + error;
});

let stage = "waiting";
let stageStart = 0;
let bunnyIndex = 0;
let bunnyLast = 0;
let photoIndex = 0;
let heartIndex = 0;
let heartPoints = [];

const pink = "#ff69b4";

const columns = [];

for (let x = 0; x < 600; x += 20) {
    columns.push({
        x,
        y: Math.random() * -700,
        speed: 4 + Math.random() * 4,
        length: 5 + Math.floor(Math.random() * 8)
    });
}

function clearScreen(color = "black") {
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, 600, 700);
}

function write(value, x, y, size, color, font = "Arial") {
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = color;
    ctx.font = `bold ${size}px ${font}`;
    ctx.fillText(value, x, y);
}

// MATRIX

function drawMatrix() {
    clearScreen("black");

    const symbols = ["0", "1", "♡", "✦"];
    const colors = ["#ff1493", "#ff69b4", "#c71585"];

    columns.forEach(col => {
        for (let j = 0; j < col.length; j++) {
            const y = col.y - j * 20;

            if (y >= 0 && y <= 700) {
                write(
                    symbols[Math.floor(Math.random() * symbols.length)],
                    col.x, y, 13,
                    colors[Math.floor(Math.random() * colors.length)]
                );
            }
        }

        col.y += col.speed;

        if (col.y > 850) {
            col.y = Math.random() * -300;
        }
    });
}

// COUNTDOWN

function drawCountdown(time) {
    clearScreen();

    const number = 3 - Math.floor(time / 850);
    write(Math.max(1, number), 300, 370, 120, pink);
}

// HAPPY / BIRTHDAY / TO

function drawWord(word, size, color) {
    clearScreen();
    write(word, 300, 370, size, color);
}

// GIFT

function drawGift() {
    clearScreen();

    for (const x of [220, 270, 320, 370]) {
        ctx.fillStyle = pink;
        ctx.fillRect(x, 180, 12, 80);

        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(x + 6, 165, 9, 0, Math.PI * 2);
        ctx.fill();
    }

    write("BASMA", 300, 390, 75, "#ff1493", "Georgia");
    write("Happy Birthday ❤️", 300, 460, 20, "white", "Arial");
}

// PURPLE DANCING BUNNY

function drawBunny(index) {
    clearScreen("#160b27");

    const bounce = index % 2 === 0 ? 15 : -15;

    // Sparkles
    for (let i = 0; i < 25; i++) {
        write(
            "✦",
            Math.random() * 580 + 10,
            Math.random() * 620 + 10,
            10 + Math.random() * 10,
            ["#ff69b4", "#d8a0ff", "white"][i % 3]
        );
    }

    // Ears
    ctx.fillStyle = "#c77dff";
    ctx.strokeStyle = "#e8baff";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.ellipse(255, 215 + bounce, 20, 65, 0, 0, Math.PI * 2);
    ctx.ellipse(345, 215 - bounce, 20, 65, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Inner ears
    ctx.fillStyle = pink;
    ctx.beginPath();
    ctx.ellipse(255, 215 + bounce, 9, 45, 0, 0, Math.PI * 2);
    ctx.ellipse(345, 215 - bounce, 9, 45, 0, 0, Math.PI * 2);
    ctx.fill();

    // Head
    ctx.fillStyle = "#d8a0ff";
    ctx.beginPath();
    ctx.arc(300, 310 + bounce, 80, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Eyes
    ctx.fillStyle = "#351044";

    for (const x of [260, 325]) {
        ctx.beginPath();
        ctx.ellipse(x + 7, 300 + bounce, 7, 10, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Cheeks
    ctx.fillStyle = pink;
    ctx.beginPath();
    ctx.ellipse(255, 330 + bounce, 15, 9, 0, 0, Math.PI * 2);
    ctx.ellipse(345, 330 + bounce, 15, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // Nose
    ctx.beginPath();
    ctx.arc(300, 325 + bounce, 5, 0, Math.PI * 2);
    ctx.fill();

    write("ω", 300, 355 + bounce, 20, "#351044");

    // Body
    ctx.fillStyle = "#b76bdf";
    ctx.beginPath();
    ctx.ellipse(300, 440 + bounce, 55, 73, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Dancing arms
    ctx.strokeStyle = "#d8a0ff";
    ctx.lineWidth = 18;
    ctx.lineCap = "round";
    ctx.beginPath();

    if (index % 2 === 0) {
        ctx.moveTo(250, 400 + bounce);
        ctx.lineTo(190, 350);
        ctx.moveTo(350, 400 + bounce);
        ctx.lineTo(410, 350);
    } else {
        ctx.moveTo(250, 400 + bounce);
        ctx.lineTo(190, 450);
        ctx.moveTo(350, 400 + bounce);
        ctx.lineTo(410, 450);
    }

    ctx.stroke();

    write("♥", 300, 445 + bounce, 35, pink);

    // Feet
    ctx.fillStyle = "#d8a0ff";
    ctx.beginPath();
    ctx.ellipse(255, 510 + bounce, 30, 22, 0, 0, Math.PI * 2);
    ctx.ellipse(345, 510 + bounce, 30, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    write("Dance, Birthday Princess!", 300, 590, 20, "#e8baff", "Georgia");
    write("Happy Birthday BASMA 💜", 300, 635, 17, pink);
}

// SLIDESHOW

function drawPhotos() {
    clearScreen("#160b27");

    write("OUR BEAUTIFUL BASMA 💜", 300, 75, 25, pink, "Georgia");

    ctx.strokeStyle = pink;
    ctx.lineWidth = 5;
    ctx.strokeRect(85, 125, 430, 445);

    const img = photos[photoIndex];

    if (img) {
        const ratio = Math.min(400 / img.width, 420 / img.height);
        const w = img.width * ratio;
        const h = img.height * ratio;

        ctx.drawImage(img, 300 - w / 2, 345 - h / 2, w, h);
    }

    write("Happy Birthday Princess! 👑", 300, 615, 19, "white", "Georgia");
    write("Forever Friends ❤️", 300, 660, 17, pink);
}

// PHOTO HEART

function createHeart() {
    heartPoints = [];

    for (let t = 0; t <= 360; t += 3) {
        const angle = t * Math.PI / 180;

        const x = 16 * Math.pow(Math.sin(angle), 3);
        const y =
            13 * Math.cos(angle)
            - 5 * Math.cos(2 * angle)
            - 2 * Math.cos(3 * angle)
            - Math.cos(4 * angle);

        heartPoints.push({
            x: 300 + x * 12.5,
            y: 350 - y * 12.5
        });
    }
}

function drawPhotoHeart() {
    clearScreen("black");

    write("WELCOME 20", 300, 340, 32, pink, "Georgia");
    write("HAPPY BIRTHDAY BASMA", 300, 385, 13, "white", "Georgia");

    for (let i = 0; i < heartIndex && i < heartPoints.length; i++) {
        const point = heartPoints[i];
        const img = photos[i % photos.length];

        ctx.save();
        ctx.beginPath();
        ctx.arc(point.x, point.y, 14, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, point.x - 14, point.y - 14, 28, 28);
        ctx.restore();
    }

    if (heartIndex >= heartPoints.length) {
        write("FOREVER FRIENDS ❤️", 300, 630, 21, pink, "Georgia");
    }
}

// MAIN ANIMATION

function animate(now) {
    const elapsed = now - stageStart;

    if (stage === "matrix") {
        drawMatrix();

        if (elapsed >= 6000) {
            stage = "countdown";
            stageStart = now;
        }
    }

    else if (stage === "countdown") {
        drawCountdown(elapsed);

        if (elapsed >= 2550) {
            stage = "happy";
            stageStart = now;
        }
    }

    else if (stage === "happy") {
        drawWord("HAPPY", 65, pink);

        if (elapsed >= 1300) {
            stage = "birthday";
            stageStart = now;
        }
    }

    else if (stage === "birthday") {
        drawWord("BIRTHDAY", 53, "#ff1493");

        if (elapsed >= 1300) {
            stage = "to";
            stageStart = now;
        }
    }

    else if (stage === "to") {
        drawWord("TO", 75, pink);

        if (elapsed >= 1000) {
            stage = "gift";
            stageStart = now;
        }
    }

    else if (stage === "gift") {
        drawGift();

        if (elapsed >= 1800) {
            stage = "bunny";
            stageStart = now;
            bunnyLast = now;
            bunnyIndex = 0;
        }
    }

    else if (stage === "bunny") {
        if (now - bunnyLast >= 140) {
            bunnyLast = now;
            drawBunny(bunnyIndex);
            bunnyIndex++;

            if (bunnyIndex >= 30) {
                stage = "slideshow";
                stageStart = now;
            }
        }
    }

    else if (stage === "slideshow") {
        drawPhotos();

        if (elapsed >= 1800) {
            photoIndex++;

            if (photoIndex >= photos.length) {
                stage = "heart";
                createHeart();
                heartIndex = 0;
            }

            stageStart = now;
        }
    }

    else if (stage === "heart") {
        drawPhotoHeart();
        heartIndex = Math.min(heartIndex + 1, heartPoints.length);
    }

    requestAnimationFrame(animate);
}

// START

startButton.addEventListener("click", () => {
    chooser.style.display = "none";
    stage = "matrix";
    stageStart = performance.now();
    requestAnimationFrame(animate);
});
</script>
</body>
</html>
